<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Clock App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock-card">
    <h2>Digital Clock</h2>
    <div id="time" class="time-display">00:00:00 AM</div>
    <div id="date" class="date-display">Date</div>
    <div class="controls">
      <button id="formatBtn">Switch to 24-Hour</button>
      <button id="toggleBtn" class="pause">Pause Clock</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
